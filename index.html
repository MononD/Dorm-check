<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>기숙사 출석체크</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1d2330;--mut:#6b7385;--pri:#3b5bdb;--ok:#2f9e44;--no:#e03131;--bd:#e3e6ee}
@media (prefers-color-scheme:dark){:root{--bg:#14161c;--card:#1e222b;--tx:#eceff5;--mut:#9aa3b5;--pri:#748ffc;--ok:#51cf66;--no:#ff6b6b;--bd:#2d3340}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.date{font-size:22px;font-weight:700}.clock{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.mut{color:var(--mut);font-size:14px}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px;margin-top:6px}
.open{background:var(--ok);color:#fff}.wait{background:var(--bd);color:var(--tx)}.closed{background:var(--no);color:#fff}
select,input,textarea,button{font:inherit;font-size:16px}
select,input,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{border:0;border-radius:10px;padding:12px 16px;background:var(--pri);color:#fff;font-weight:700;cursor:pointer}
button.big{width:100%;margin-top:10px;padding:16px;font-size:18px}
button.late{background:var(--no)}
button:disabled{opacity:.4;cursor:not-allowed}
button.sec{background:var(--bd);color:var(--tx)}
.row{display:flex;gap:8px}
h2{font-size:17px;margin:0 0 10px}
.msg{margin-top:10px;font-weight:700}.ok{color:var(--ok)}.no{color:var(--no)}
.redname{color:var(--no);font-weight:700}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;padding:8px 0;border-bottom:1px solid var(--bd)}
li button{padding:6px 10px;font-size:13px}
.btns{display:flex;gap:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.cols{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="date" id="date">불러오는 중...</div>
    <div class="clock" id="clock"></div>
    <div class="mut">정상 23:00~23:30 · 시간외 23:30~다음날 09:00</div>
    <span class="badge wait" id="status"></span>
    <div class="mut" id="base"></div>
  </div>
  <div class="tabs"><button id="tabS">학생 출석</button><button id="tabA" class="sec">관리자</button></div>

  <div id="student" class="card">
    <h2>내 이름 선택</h2>
    <select id="who"></select>
    <button class="big" id="go">출석 체크</button>
    <div class="msg" id="smsg"></div>
  </div>

  <div id="admin" class="hide">
    <div class="card" id="login">
      <h2>관리자 로그인</h2>
      <div class="row"><input type="password" id="pw" placeholder="암호"><button id="loginBtn" style="width:90px">입장</button></div>
      <div class="msg no" id="lmsg"></div>
    </div>
    <div id="panel" class="hide">
      <div class="card">
        <h2>출석 현황</h2>
        <div class="mut" id="count"></div>
        <div class="cols" style="margin-top:8px">
          <div><b class="ok">✅ 출석</b><ul id="okList"></ul></div>
          <div><b class="no">❌ 미출석</b><ul id="noList"></ul></div>
        </div>
        <button class="sec big" id="refresh">새로고침</button>
      </div>
      <div class="card">
        <h2>지난 출석 기록</h2>
        <input type="date" id="hdate">
        <div class="msg mut" id="hcount"></div>
        <div class="cols">
          <div><b class="ok">✅ 출석</b><ul id="hOk"></ul></div>
          <div><b class="no">❌ 미출석</b><ul id="hNo"></ul></div>
        </div>
      </div>
      <div class="card">
        <h2>학생 명단 관리</h2>
        <div class="mut" style="margin-bottom:8px">한 줄에 한 명씩 "호실 이름" 형식 (예: 102/1202 차지윤)</div>
        <textarea id="roster" rows="8"></textarea>
        <button class="big" id="saveRoster">명단 저장</button>
        <div class="msg" id="rmsg"></div>
      </div>
    </div>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwx6rHPdutfX4fBHiHlKeywaLvfQzUk99AfID-UAqFduSvjtFN3_p9TV2tM1NtcNMNDUg/exec";

// 서버가 느려도 바로 이름이 뜨도록 내장한 기본 명단
const DEFAULT_ROSTER = {
  "102/1202": "차지윤 이현영 정수안",
  "106/1202": "한수진 김예은 윤지연 정윤서",
  "201/501": "서민영 조성빈 차명희 이연주",
  "201/703": "이여진 김민서 박지은 서지윤",
  "201/1204": "박예진 정윤정 김서하 임성하",
  "201/1205": "신다민 장은아 이은비 정윤솔",
  "202/501": "박시유 최수연 박경림 김고은 임혜인",
  "202/701": "최다인 허윤서 이서윤 이수연",
  "202/405": "김애슬 최하경 박민혜 최서윤 정다현",
  "202/506": "구한나 손예린 홍예서 김려원"
};

const $=id=>document.getElementById(id);
const DAYS=["일","월","화","수","목","금","토"];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let students=[],checked=[],offset=0,pw=null,pollTimer=null,sdate="";

function defaultList(){
  const l=[];
  Object.keys(DEFAULT_ROSTER).forEach(room=>DEFAULT_ROSTER[room].split(" ").forEach(name=>l.push({room,name,key:room+"|"+name})));
  return l;
}
function loadCached(){
  try{const c=JSON.parse(localStorage.getItem("roster_v2"));if(c&&c.length)return c;}catch(e){}
  return defaultList();
}
function saveCached(l){try{localStorage.setItem("roster_v2",JSON.stringify(l));}catch(e){}}

async function call(body){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  return r.json();
}
// 실패하면 간격을 늘려가며 자동 재시도 (사람이 몰릴 때 대비)
async function callRetry(body,tries,onRetry){
  for(let i=0;i<tries;i++){
    try{return await call(body);}
    catch(e){
      if(i===tries-1)throw e;
      if(onRetry)onRetry(i+1,tries);
      await sleep(1000+i*1500+Math.random()*1500);
    }
  }
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function phaseOf(m){return m>=1380&&m<1410?"normal":(m>=1410||m<540)?"late":"wait";}
function kst(){
  const p=Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(new Date(Date.now()+offset)).map(x=>[x.type,x.value]));
  const mins=+p.hour*60+ +p.minute;
  const dt=new Date(Date.UTC(+p.year,+p.month-1,+p.day));
  const bd=new Date(Date.UTC(+p.year,+p.month-1,+p.day-(mins<540?1:0)));
  return{y:+p.year,m:+p.month,d:+p.day,dow:DAYS[dt.getUTCDay()],h:p.hour,mi:p.minute,s:p.second,mins,
    bm:bd.getUTCMonth()+1,bd:bd.getUTCDate(),bdow:DAYS[bd.getUTCDay()]};
}
function tick(){
  const t=kst(),ph=phaseOf(t.mins);
  $("date").textContent=`${t.y}년 ${t.m}월 ${t.d}일 (${t.dow}요일)`;
  $("clock").textContent=`${t.h}:${t.mi}:${t.s}`;
  $("status").className="badge "+(ph==="normal"?"open":ph==="late"?"closed":"wait");
  $("status").textContent=ph==="normal"?"정상 출석 진행 중 (23:30까지)":ph==="late"?"시간 외 · 시간외로 기록됩니다":"체크 시간이 아닙니다 (23:00 시작)";
  $("base").textContent=ph==="wait"?"":`출석 기준일: ${t.bm}월 ${t.bd}일 (${t.bdow})`;
  const go=$("go");
  go.disabled=ph==="wait"||!$("who").value||busy;
  go.className="big"+(ph==="late"?" late":"");
  go.textContent=ph==="late"?"시간 외 출석 체크":"출석 체크";
}
function renderSelect(){
  const prev=$("who").value;
  const rooms=[...new Set(students.map(s=>s.room))];
  $("who").innerHTML='<option value="">-- 이름을 선택하세요 --</option>'+rooms.map(rm=>`<optgroup label="${esc(rm||"호실 미지정")}">`+students.filter(s=>s.room===rm).map(s=>`<option value="${esc(s.key)}">${esc(s.name)}</option>`).join("")+"</optgroup>").join("");
  $("who").value=prev;
}
function okLi(s,r,btn){
  const late=r.type==="시간외";
  return `<li><span class="${late?"redname":""}">${esc(s.name)} <span class="${late?"redname":"mut"}">${esc(s.room)}</span>${late?" [시간외]":""}<br><span class="mut">${esc(r.time)}${r.by?" · "+esc(r.by):""}</span></span>${btn?`<button class="sec" data-k="${esc(s.key)}" data-on="0">취소</button>`:""}</li>`;
}
function split(list,chk){
  const map=Object.fromEntries(chk.map(c=>[c.key,c]));
  const ok=list.filter(s=>map[s.key]).sort((a,b)=>(map[a.key].type==="시간외")-(map[b.key].type==="시간외"));
  return{map,ok,no:list.filter(s=>!map[s.key])};
}
function renderAdmin(){
  const{map,ok,no}=split(students,checked);
  const late=ok.filter(s=>map[s.key].type==="시간외").length;
  $("count").textContent=`기준일 ${sdate} · 정상 ${ok.length-late} / 시간외 ${late} / 미출석 ${no.length} / 전체 ${students.length}`;
  $("okList").innerHTML=ok.map(s=>okLi(s,map[s.key],true)).join("")||'<li class="mut">없음</li>';
  $("noList").innerHTML=no.map(s=>`<li><span>${esc(s.name)} <span class="mut">${esc(s.room)}</span></span><span class="btns"><button data-k="${esc(s.key)}" data-on="1" data-t="정상">정상</button><button class="late" data-k="${esc(s.key)}" data-on="1" data-t="시간외">시간외</button></span></li>`).join("")||'<li class="mut">없음</li>';
}
async function loadAdmin(){
  try{
    const r=await call({action:"adminState",pw});
    if(!r.ok)return;
    students=r.students;saveCached(students);checked=r.checked;sdate=r.now.sdate;renderSelect();renderAdmin();
  }catch(e){}
}

let busy=false;
$("go").onclick=async()=>{
  const m=$("smsg");busy=true;m.className="msg mut";m.textContent="처리 중...";tick();
  const key=$("who").value;
  try{
    await sleep(Math.random()*1000);
    const r=await callRetry({action:"checkin",key},6,(i,n)=>{m.textContent=`접속자가 많아 재시도 중... (${i}/${n-1})`;});
    m.className="msg "+(r.ok&&r.type!=="시간외"?"ok":"no");m.textContent=r.msg;
  }catch(e){m.className="msg no";m.textContent="연결 오류. 잠시 후 다시 눌러주세요.";}
  busy=false;tick();
};
$("who").onchange=tick;
$("tabS").onclick=()=>{$("student").classList.remove("hide");$("admin").classList.add("hide");$("tabS").classList.remove("sec");$("tabA").classList.add("sec");};
$("tabA").onclick=()=>{$("admin").classList.remove("hide");$("student").classList.add("hide");$("tabA").classList.remove("sec");$("tabS").classList.add("sec");};
$("loginBtn").onclick=async()=>{
  const p=$("pw").value,b=$("loginBtn");
  b.disabled=true;$("lmsg").className="msg mut";$("lmsg").textContent="확인 중...";
  try{
    const r=await callRetry({action:"adminState",pw:p},4,(i)=>{$("lmsg").textContent=`접속자가 많아 재시도 중... (${i})`;});
    if(r.ok){
      pw=p;students=r.students;saveCached(students);checked=r.checked;sdate=r.now.sdate;
      $("login").classList.add("hide");$("panel").classList.remove("hide");
      renderSelect();renderAdmin();
      $("roster").value=students.map(s=>(s.room?s.room+" ":"")+s.name).join("\n");
      if(!pollTimer)pollTimer=setInterval(()=>{if(!document.hidden)loadAdmin();},30000);
    }else{$("lmsg").className="msg no";$("lmsg").textContent=r.msg;}
  }catch(e){$("lmsg").className="msg no";$("lmsg").textContent="연결 오류. 다시 시도하세요.";}
  b.disabled=false;
};
$("pw").onkeydown=e=>{if(e.key==="Enter")$("loginBtn").click();};
$("refresh").onclick=loadAdmin;
$("saveRoster").onclick=async()=>{
  $("rmsg").className="msg mut";$("rmsg").textContent="저장 중...";
  try{
    const r=await call({action:"saveRoster",pw,lines:$("roster").value.split("\n")});
    $("rmsg").className="msg "+(r.ok?"ok":"no");$("rmsg").textContent=r.ok?"저장되었습니다.":r.msg;
    if(r.ok)loadAdmin();
  }catch(e){$("rmsg").className="msg no";$("rmsg").textContent="연결 오류";}
};
$("hdate").onchange=async()=>{
  const d=$("hdate").value;if(!d)return;
  $("hcount").textContent="불러오는 중...";
  try{
    const r=await call({action:"history",pw,date:d});
    if(!r.ok){$("hcount").textContent=r.msg||"조회 실패";return;}
    const{map,ok,no}=split(r.students,r.checked);
    const late=ok.filter(s=>map[s.key].type==="시간외").length;
    $("hcount").textContent=`${d} · 정상 ${ok.length-late} / 시간외 ${late} / 미출석 ${no.length}`;
    $("hOk").innerHTML=ok.map(s=>okLi(s,map[s.key],false)).join("")||'<li class="mut">없음</li>';
    $("hNo").innerHTML=no.map(s=>`<li><span>${esc(s.name)} <span class="mut">${esc(s.room)}</span></span></li>`).join("")||'<li class="mut">없음</li>';
  }catch(e){$("hcount").textContent="연결 오류";}
};
document.addEventListener("click",async e=>{
  const k=e.target.dataset.k;if(!k)return;
  e.target.disabled=true;
  try{await call({action:"adminSet",pw,key:k,on:e.target.dataset.on==="1",type:e.target.dataset.t});}catch(err){}
  loadAdmin();
});

// 시작: 저장된 명단으로 즉시 표시 → 백그라운드에서 최신 명단/서버 시간 갱신
students=loadCached();renderSelect();
setInterval(tick,1000);tick();
(async()=>{
  try{
    const r=await callRetry({action:"state"},5);
    offset=r.now.ms-Date.now();
    if(r.students&&r.students.length){students=r.students;saveCached(students);renderSelect();}
    tick();
  }catch(e){}
})();
</script>
</body>
</html>
